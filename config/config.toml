[server]
port = 8787

[storage]
# Relative to the project root. Holds pdf/ and thumbnail/ subdirectories.
data_dir = "backend/data"
max_upload_mb = 100

[log]
# Options: "debug" | "info" | "warn" | "error"
level = "info"

[auth]
# How long a login stays valid. The admin account itself is set in .env (account / password).
session_days = 30
