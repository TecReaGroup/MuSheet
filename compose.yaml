name: musheet

services:
  postgres:
    image: postgres:17-alpine
    container_name: musheet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musheet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musheet}
      POSTGRES_DB: ${POSTGRES_DB:-musheet}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: musheet-app
    container_name: musheet-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8787"
    volumes:
      - ./backend/data:/app/backend/data
      - ./log:/app/log
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-musheet}:${POSTGRES_PASSWORD:-musheet}@postgres:5432/${POSTGRES_DB:-musheet}
      account: ${account:?set account in .env}
      password: ${password:?set password in .env}

volumes:
  postgres-data:
    name: musheet-postgres-data
